# Fake credentials only. Tests refuse to fall back from DATABASE_URL_TEST to a
# real DATABASE_URL. Mailpit is required by tests/integration/test_smtp_sink.py;
# the rest of the suite captures mail in-process (CapturingEmailAdapter).
# Migration 0013 reads backend/demo through the shared seed helper.
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      DATABASE_URL_TEST: postgresql://test:test@127.0.0.1:5432/test
      BOOTSTRAP_TEACHER_PASSWORD: DanPhuong@2024
      AI_PROVIDER: fake
      AI_MODEL: fake-model
      OPENAI_API_KEY: test-key-for-fake
      GEMINI_API_KEY: test-key-for-fake
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      RESEND_API_KEY: ""
      BREVO_API_KEY: ""
      GMAIL_WEBHOOK_URL: ""
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Use the Python installed by setup-python
        run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: uv sync --extra dev --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
