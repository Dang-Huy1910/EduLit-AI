[project]
name = "edulit-ai-auth"
version = "0.1.0"
description = "EduLit-AI Python FastAPI identity and authentication service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=3.0.2,<4",
    "alembic>=1.14.0,<2",
    "argon2-cffi>=23.1.0,<26",
    "asyncpg>=0.30.0,<1",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.115.0,<1",
    "httpx>=0.27.0,<1",
    "pydantic[email]>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-dotenv>=1.0.1,<2",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.32.0,<1",
]

[project.optional-dependencies]
dev = [
    "psycopg2-binary>=2.9.9,<3",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
]

[project.scripts]
edulit-auth = "app.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
