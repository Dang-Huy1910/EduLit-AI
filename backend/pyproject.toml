[project]
name = "edulit-ai-auth"
version = "0.1.0"
description = "EduLit-AI API for authentication, Socratic writing, teacher tools, and assessment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=3.0.2,<4",
    "alembic>=1.14.0,<2",
    "argon2-cffi>=23.1.0,<26",
    "asyncpg>=0.30.0,<1",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.115.0,<1",
    "google-genai>=0.3.0,<1",
    "httpx>=0.27.0,<1",
    "langgraph>=0.2.0,<1",
    "langchain-core>=0.3.0,<1",
    "openai>=1.0.0,<2",
    "psycopg2-binary>=2.9.9,<3",
    "pydantic[email]>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-dotenv>=1.0.1,<2",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.32.0,<1",
    "markitdown[docx,pdf,xlsx]>=0.1.8,<0.2",
    "python-multipart>=0.0.9,<0.1",
    "pillow>=10.4.0,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
edulit-auth = "app.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.cmdclass]
build_py = "_prompt_build.build_py"
sdist = "_prompt_build.sdist"
editable_wheel = "_prompt_build.editable_wheel"

[tool.setuptools.package-data]
"app.ai.prompts" = ["**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Bootstrap sys.path and the test environment before importing app.main (creates app).
"tests/conftest.py" = ["E402"]
